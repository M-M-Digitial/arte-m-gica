name: Deploy to VPS

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:escola

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ESCOLA_VPS_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ESCOLA_VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy (release + symlink na VPS da escola)
        run: |
          # A escola é servida via proxy da autobox -> crmcreator, de
          # $ESCOLA_VPS_BASE/current/agentes-artesaos (esquema de releases).
          REL="$(date +%Y%m%d-%H%M%S)-gh-${GITHUB_SHA::7}"
          BASE="${{ secrets.ESCOLA_VPS_BASE }}"
          DEST="${{ secrets.ESCOLA_VPS_USER }}@${{ secrets.ESCOLA_VPS_HOST }}"
          ssh -i ~/.ssh/deploy_key "$DEST" "mkdir -p '$BASE/releases/$REL/agentes-artesaos'"
          rsync -az -e "ssh -i ~/.ssh/deploy_key" dist/ "$DEST:$BASE/releases/$REL/agentes-artesaos/"
          ssh -i ~/.ssh/deploy_key "$DEST" "ln -sfn '$BASE/releases/$REL' '$BASE/current' && ls '$BASE/current/agentes-artesaos/index.html' && cd '$BASE/releases' && ls -dt */ | tail -n +6 | xargs -r rm -rf"
