server {
    listen 80;
    listen [::]:80;
    server_name appateliedigital.com.br www.appateliedigital.com.br;

    root /var/www/meu-atelie-digital/current;
    index index.html;

    client_max_body_size 15m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=()" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location = /agentes-artesaos {
        return 308 /agentes-artesaos/;
    }

    location = /agentes-artesãos {
        return 308 /agentes-artesaos/;
    }

    location /agentes-artesaos/assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /agentes-artesaos/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /agentes-artesaos/ {
        try_files $uri $uri/ /agentes-artesaos/index.html;
    }

    location / {
        return 404;
    }
}
