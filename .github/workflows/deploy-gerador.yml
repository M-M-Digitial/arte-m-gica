name: Deploy MoldePronto (gerador)

# App dos moldes na RAIZ do domínio. O slug agentes-artesaos/ é preservado
# (é o Meu Ateliê Digital, publicado pelo workflow deploy.yml).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-gerador
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (gerador de moldes)
        run: npm run build:gerador

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          for attempt in 1 2 3 4 5 6; do
            if timeout 15 ssh-keyscan -p "${{ secrets.VPS_PORT || '22' }}" -H "${{ secrets.VPS_HOST }}" > /tmp/vps_host_key 2>/dev/null; then
              cat /tmp/vps_host_key >> ~/.ssh/known_hosts
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "Servidor SSH indisponivel apos 6 tentativas."
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Deploy dist/ para a raiz (preservando o slug da escola)
        run: |
          rsync -avz --delete --exclude 'agentes-artesaos' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT || '22' }}" \
            dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_TARGET_DIR }}"
